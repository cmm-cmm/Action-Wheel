# The website, https://actionwheel.konexforge.com/ - static files in site/, served by a
# Cloudflare Worker with static assets, like the other KonexForge sites. No build step: the
# folder is uploaded as it is. Deploy with:  npx wrangler deploy
name = "action-wheel"
compatibility_date = "2026-10-01"
workers_dev = false

# A Custom Domain: wrangler creates the DNS record and the certificate for it on deploy.
# Wrangler has no top-level [[custom_domains]] table - it warns "Unexpected fields" and skips it,
# so the domain would never be attached. It has to be a route with custom_domain = true.
routes = [
    { pattern = "actionwheel.konexforge.com", custom_domain = true }
]

[assets]
directory = "./site"
not_found_handling = "404-page"
