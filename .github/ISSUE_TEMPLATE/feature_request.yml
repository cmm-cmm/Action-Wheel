name: Feature request
description: Suggest an idea or improvement for Action Wheel.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that Action Wheel doesn't support today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're using now, or other approaches you thought about.

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Mockups, similar features in other apps, or other context.
